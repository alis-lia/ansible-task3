---
- name: Instalar Apache y PHP (una sola transaccion de zypper)
  community.general.zypper:
    name: "{{ apache_packages }}"
    state: present

- name: Comprobar si mod_php8 esta habilitado
  ansible.builtin.command: a2enmod -q php8
  register: apache_php_mod
  changed_when: false
  failed_when: false

- name: Habilitar mod_php8
  ansible.builtin.command: a2enmod php8
  when: apache_php_mod.rc != 0
  changed_when: true
  notify: Reiniciar apache2

- name: Pagina de prueba de PHP
  ansible.builtin.template:
    src: index.php.j2
    dest: /srv/www/htdocs/index.php
    owner: root
    group: root
    mode: "0644"

- name: Comprobar booleano SELinux para conexiones de Apache a bases de datos
  ansible.builtin.command: getsebool httpd_can_network_connect_db
  register: apache_php_sebool
  changed_when: false
  failed_when: false

- name: Permitir a Apache conectarse a MariaDB/PostgreSQL (SELinux)
  ansible.builtin.command: setsebool -P httpd_can_network_connect_db 1
  when: "'off' in apache_php_sebool.stdout"
  changed_when: true

- name: Iniciar y habilitar Apache
  ansible.builtin.systemd:
    name: apache2
    state: started
    enabled: true

- name: Abrir HTTP en el firewall
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
