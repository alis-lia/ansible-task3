---
- name: Instalar vsftpd
  community.general.zypper:
    name: vsftpd
    state: present

- name: Configurar vsftpd desde plantilla
  ansible.builtin.template:
    src: vsftpd.conf.j2
    dest: /etc/vsftpd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar vsftpd

- name: Comprobar booleano SELinux de FTP
  ansible.builtin.command: getsebool ftpd_full_access
  register: vsftpd_sebool
  changed_when: false
  failed_when: false

- name: Permitir acceso de FTP a las carpetas de usuario (SELinux)
  ansible.builtin.command: setsebool -P ftpd_full_access 1
  when: "'off' in vsftpd_sebool.stdout"
  changed_when: true

- name: Abrir FTP en el firewall
  ansible.posix.firewalld:
    service: ftp
    permanent: true
    immediate: true
    state: enabled

- name: Abrir puertos pasivos de FTP en el firewall
  ansible.posix.firewalld:
    port: "{{ vsftpd_pasv_min_port }}-{{ vsftpd_pasv_max_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Iniciar y habilitar vsftpd
  ansible.builtin.systemd:
    name: vsftpd
    state: started
    enabled: true
