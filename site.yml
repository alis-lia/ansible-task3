---
# Tareas 3 y 5 - ASO G1 y G2 - GRUPO DE ENTREGA G8
# Ejecutar: ansible-playbook site.yml -k --ask-vault-pass
- name: Despliegue remoto LAMP + Samba + FTP + PostgreSQL en openSUSE Leap 16.0
  hosts: servidores
  become: true
  gather_facts: false   # no se usan facts: ahorra tiempo en cada ejecucion
  roles:
        # Roles en orden de ejecucion (Tarea 3: LAMP, Samba, FTP / Tarea 5: PostgreSQL)
    - { role: apache_php, tags: [lamp, apache] }
    - { role: mariadb, tags: [lamp, mariadb] }
    - { role: phpmyadmin, tags: [lamp, phpmyadmin] }
    - { role: samba, tags: [samba] }
    - { role: vsftpd, tags: [ftp] }
    - { role: postgresql, tags: [postgresql] }
