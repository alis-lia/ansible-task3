[defaults]
inventory           = inventory/hosts.yml
roles_path          = roles
remote_user         = root
host_key_checking   = False
interpreter_python  = auto_silent
forks               = 10
# Muestra cuanto tarda cada tarea (evidencia de "Improve time response")
callbacks_enabled   = ansible.posix.profile_tasks

[ssh_connection]
# Menos conexiones SSH por tarea = ejecucion mas rapida
pipelining          = True
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s
